[project]
name = "apple-support-agent"
version = "1.0.0"
description = "Grounded AI Customer Support Agent for @AppleSupport with Reasoned Escalation Policy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "pytest>=8.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
